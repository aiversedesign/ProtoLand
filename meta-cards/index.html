    // Download first card only
    async function downloadFirstCard() {
      const firstCard = document.getElementById('card-0');
      if (firstCard) {
        await downloadCard(firstCard, 'card-0');
      }
    }

    // Download all cards
    async function downloadAllCards() {
      const allCards = document.querySelectorAll('.meta-card');
      const button = event.target;
      const originalText = button.textContent;
      
      button.disabled = true;
      
      for (let i = 0; i < allCards.length; i++) {
        button.textContent = `Downloading ${i + 1}/${allCards.length}...`;
        await downloadCard(allCards[i], `card-${i}`);
        await new Promise(resolve => setTimeout(resolve, 500)); // Small delay between downloads
      }
      
      button.textContent = originalText;
      button.disabled = false;
      alert(`Successfully downloaded ${allCards.length} cards!`);
    }

    // Download individual card
    async function downloadCard(card, cardId) {
      if (!card) {
        alert('Card not found!');
        return;
      }
      
      try {
        console.log('Starting capture of', cardId);
        
        // Wait for images and fonts to load
        await new Promise(resolve => setTimeout(resolve, 500));
        
        // Use full card dimensions (not scaled)
        const targetWidth = 1200;
        const targetHeight = 628;
        const padding = 250; // Extra space for shadows and overflow
        const scale = 2;
        
        // Create off-screen wrapper to capture full card with overflow
        const wrapper = document.createElement('div');
        wrapper.style.position = 'absolute';
        wrapper.style.left = '-9999px';
        wrapper.style.top = '0';
        wrapper.style.width = (targetWidth + padding * 2) + 'px';
        wrapper.style.height = (targetHeight + padding * 2) + 'px';
        wrapper.style.padding = padding + 'px';
        wrapper.style.background = '#FBF5F1';
        wrapper.style.overflow = 'visible';
        wrapper.style.boxSizing = 'border-box';
        
        // Clone the card to avoid modifying original
        const cardClone = card.cloneNode(true);
        cardClone.id = cardId + '-clone';
        cardClone.style.position = 'relative';
        cardClone.style.left = '0';
        cardClone.style.top = '0';
        cardClone.style.margin = '0';
        cardClone.style.marginBottom = '0';
        cardClone.style.marginRight = '0';
        cardClone.style.overflow = 'visible';
        cardClone.style.transform = 'none'; // Remove the 0.2 scale
        cardClone.style.transformOrigin = 'center';
        cardClone.style.width = targetWidth + 'px';
        cardClone.style.height = targetHeight + 'px';
        
        // Set overflow visible on nested elements
        const stackedCards = cardClone.querySelectorAll('.stacked-cards');
        const previewCards = cardClone.querySelectorAll('.preview-card');
        stackedCards.forEach(el => el.style.overflow = 'visible');
        previewCards.forEach(el => el.style.overflow = 'visible');
        
        // Fix image rendering - show full images without cropping
        const cardImages = cardClone.querySelectorAll('.card-image');
        cardImages.forEach(img => {
          img.style.objectFit = 'contain'; // Show full image without cropping
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.imageRendering = 'high-quality';
          img.style.imageRendering = '-webkit-optimize-contrast';
        });
        
        wrapper.appendChild(cardClone);
        document.body.appendChild(wrapper);
        
        // Wait for images to load
        const allImages = wrapper.querySelectorAll('img');
        await Promise.all(
          Array.from(allImages).map(img => {
            if (img.complete) return Promise.resolve();
            return new Promise((resolve) => {
              img.onload = resolve;
              img.onerror = resolve;
              setTimeout(resolve, 2000); // Timeout after 2s
            });
          })
        );
        
        // Wait for layout and fonts
        await new Promise(resolve => setTimeout(resolve, 500));
        
        // Capture wrapper
        const fullCanvas = await html2canvas(wrapper, {
          scale: scale,
          useCORS: true,
          allowTaint: false,
          backgroundColor: '#FBF5F1',
          logging: false,
          width: wrapper.offsetWidth,
          height: wrapper.offsetHeight,
          imageTimeout: 0,
          removeContainer: true
        });
        
        // Clean up wrapper
        document.body.removeChild(wrapper);
        
        // Crop to exact card dimensions
        const cropX = padding * scale;
        const cropY = padding * scale;
        const cropWidth = targetWidth * scale;
        const cropHeight = targetHeight * scale;
        
        // Create final canvas at exact dimensions (no shadow/padding)
        const canvas = document.createElement('canvas');
        canvas.width = cropWidth;
        canvas.height = cropHeight;
        const ctx = canvas.getContext('2d');
        
        // Draw the card image at exact dimensions
        ctx.drawImage(fullCanvas, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
        
        console.log('Canvas created:', canvas.width, 'x', canvas.height);
        
        // Get selected format
        const formatSelector = document.getElementById('format-selector');
        const format = formatSelector ? formatSelector.value : 'png';
        
        // Convert to blob with selected format
        const blob = await new Promise((resolve) => {
          if (format === 'avif') {
            // Try to use AVIF format (not all browsers support it)
            canvas.toBlob(resolve, 'image/avif', 0.85);
          } else {
            canvas.toBlob(resolve, 'image/png', 1.0);
          }
        });
        
        if (!blob) {
          throw new Error('Failed to generate image blob');
        }
        
        // Get pattern name for filename
        const patternName = card.getAttribute('data-pattern') || cardId;
        const filename = patternName.replace(/[^a-z0-9]/gi, '-').toLowerCase();
        
        // Create download link with blob URL
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = `${filename}.${format}`;
        link.href = blobUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        // Clean up blob URL
        setTimeout(() => URL.revokeObjectURL(blobUrl), 100);
        
        console.log('Download triggered successfully');
        
      } catch (error) {
        console.error('Download error:', error);
        const errorMsg = error && error.message ? error.message : 'Unknown error occurred';
        alert('Error generating image: ' + errorMsg + '\n\nPlease try again or check console for details.');
      }
    }

    // Generate cards on page load
    window.addEventListener('DOMContentLoaded', generateCards);
  </script>
</body>
</html>
